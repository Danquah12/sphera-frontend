services:
  # ── PostgreSQL ─────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: sphera_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-sphera}
      POSTGRES_USER:     ${POSTGRES_USER:-sphera}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sphera_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sphera}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ─────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sphera_api
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sphera}:${POSTGRES_PASSWORD:-sphera_secret}@db:5432/${POSTGRES_DB:-sphera}
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/static/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Nginx Reverse Proxy ─────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: sphera_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads:/app/static/uploads:ro
      - ./nginx/certs:/etc/nginx/certs:ro   # mount SSL certs here
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
